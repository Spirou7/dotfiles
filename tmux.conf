# =====================
# Sensible defaults
# =====================

# Address vim mode switching delay
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Tmux messages are displayed for 4 seconds
set -g display-time 4000

# Refresh status-left and status-right more often
set -g status-interval 5

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Emacs key bindings in tmux command prompt (prefix + :)
set -g status-keys emacs

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# =====================
# Custom settings
# =====================

# 1-indexed windows
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

# Scroll 1 line at a time, auto-exit copy-mode when scrolling back to bottom
# If the program has mouse support (e.g. neovim), pass scroll through;
# if already in copy-mode, pass scroll through; otherwise enter copy-mode
bind -n WheelUpPane if-shell -Ft= "#{mouse_any_flag}" "send-keys -M" "if-shell -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down
set -g set-clipboard on
set -g mode-keys vi
set -g mode-style 'bg=#7c3aed fg=white'

# Simpler window chooser - sessions and windows only (no panes)
bind -n C-w choose-tree -Zw -F '#{window_name}'
bind w choose-tree -Zw -F '#{window_name}'

# Custom prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Navigate panes with Cmd + vim-style keys (no prefix needed)
# Terminal must send M-h/j/k/l for Cmd+h/j/k/l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Switch windows with Cmd + number (no prefix needed)
# Terminal must send M-1..9 for Cmd+1..9
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Swap window order (prefix + h/l)
bind h swap-window -t -1\; select-window -t -1
bind l swap-window -t +1\; select-window -t +1

# Resize panes (with prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Easier switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Zoom toggle with Ctrl+Space (hold ctrl after prefix)
bind C-Space resize-pane -Z

# Pane naming: prefix + Space + p
bind Space switch-client -T space_keys
bind -T space_keys p command-prompt -p "Pane name:" "select-pane -T '%%'"
bind -n C-y if-shell -F '#{@pane_brown}' 'select-pane -P bg=default ; set -p @pane_brown 0' 'select-pane -P bg=#3e2c1c ; set -p @pane_brown 1'
bind -n C-u if-shell -F '#{@pane_gray}' 'select-pane -P bg=default ; set -p @pane_gray 0' 'select-pane -P bg=#4c566a ; set -p @pane_gray 1'
set -g pane-border-status top
set -g pane-border-format " #{?pane_title,#{pane_title},─} "

# Source tmux.conf with R
bind R source-file ~/.tmux.conf \; display-message "Sourced ~/.tmux.conf!"

# Pass Shift+Enter through for Claude Code
bind -n S-Enter send-keys Escape "[13;2u"

# Open new windows/panes in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Status bar position
set -g status on
set -g status-position top

# =====================
# TPM (Tmux Plugin Manager)
# =====================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

# Dracula theme settings
set -g @dracula-show-powerline true
set -g @dracula-plugins "time"
set -g @dracula-show-left-icon session
set -g @dracula-border-contrast true

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
